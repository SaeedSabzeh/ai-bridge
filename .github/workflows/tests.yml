name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # The bridge is developed and used on Windows; its file locks and process handling differ per OS.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
